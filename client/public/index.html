<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0F0F0F" />
  <meta name="description" content="RydeNode: a tri-node ride platform for customers, car owners and drivers." />
  <title>RydeNode</title>
  <script>
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("ryde_theme");
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch (e) { t = "dark"; }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run RydeNode.</noscript>
  <div id="root"></div>
</body>
</html>
